# ServiceLogi website — static Vite build behind the VM's Caddy edge proxy.
# Caddy terminates TLS and handles HTTP->HTTPS; this only serves files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx does not inherit add_header into locations that set their own,
    # so these are repeated in every location below that adds a header.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets/.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed images in public/ (portfolio screenshots, og-image, logo).
    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html names the hashed bundles; a cached copy hides a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
