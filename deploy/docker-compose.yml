# ServiceLogi website — production on the shared VM (/opt/portfolio).
# Images are built by CI and only pulled here; never `docker compose build`.
name: portfolio

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    # Loopback only; Caddy in /opt/vm-edge publishes it as servicelogi.com.
    ports:
      - "127.0.0.1:8086:80"
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
